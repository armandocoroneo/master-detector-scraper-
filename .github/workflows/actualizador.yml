name: Monitor de Precios Automatico

on:
  workflow_dispatch: # Te permite activarlo manualmente con un botón cuando quieras
  schedule:
    # Se ejecuta todos los días a las 11:00 UTC 
    # (7:00 AM de Bolivia / 6:00 AM de Perú)
    - cron: '0 11 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Descarga el código de tu repositorio
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    # 2. Configura el entorno de Python
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Instala las librerías necesarias para tu main.py
    # (Agrega aquí o quita librerías si tu script usa otras como beautifulsoup4)
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install requests

    # 4. Ejecuta tu script para generar el nuevo index.html
    - name: Ejecutar monitor de precios
      run: python main.py

    # 5. Guarda los cambios y los sube a tu rama main automáticamente
    - name: Guardar cambios y actualizar HTML
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add index.html
        git diff-index --quiet HEAD || git commit -m "Bot: Actualización automática de precios"
        git push
